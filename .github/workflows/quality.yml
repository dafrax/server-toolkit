name: Shell Script Quality

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.sh"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
